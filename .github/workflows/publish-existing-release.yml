name: Publish existing verified desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to mirror and publish
        required: true
        default: v3.19.26

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download existing release and embedded public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$REPO" --json body,assets > release.json
          gh release download "$TAG" --repo "$REPO" --pattern 'ClawKit-*.exe' --pattern 'ClawKit-*.exe.sig' --pattern 'ClawKit-*.dmg' --pattern 'ClawKit-*.app.tar.gz' --pattern 'ClawKit-*.app.tar.gz.sig' --dir installers
          gh api repos/hangvlog/cc-switch/contents/src-tauri/tauri.conf.json?ref=2316d09008f3bddf8cc81f761158001caff6d1e5 --jq .content | base64 --decode > shell-config.json
          node .github/scripts/verify-updater-signature.mjs shell-config.json installers/*.exe installers/*.app.tar.gz
      - name: Verify original asset digests
        run: |
          node --input-type=module <<'JS'
          import {readFile, readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const release = JSON.parse(await readFile('release.json', 'utf8'));
          for (const name of await readdir('installers')) {
            const asset = release.assets.find(a => a.name === name);
            const bytes = await readFile(`installers/${name}`);
            const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            if (!asset || asset.size !== bytes.length || asset.digest !== digest) throw new Error(`Asset mismatch: ${name}`);
            console.log(`Verified release asset: ${name}`);
          }
          JS
      - name: Mirror to COS and publish using existing APIs
        env:
          API_BASE: ${{ secrets.CLAWKIT_API_BASE }}
          RELEASE_TOKEN: ${{ secrets.CLAWKIT_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          process.env.RELEASE_BODY = JSON.parse(await readFile('release.json', 'utf8')).body;
          process.argv[2] = 'installers';
          await import('./.github/scripts/publish-clawkit-release.mjs');
          JS

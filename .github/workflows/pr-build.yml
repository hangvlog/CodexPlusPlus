name: PR build artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ClawKit Desktop shell
        uses: actions/checkout@v4
        with:
          repository: hangvlog/cc-switch
          ref: main
          path: vendor/cc-switch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: pnpm install --frozen-lockfile

      - name: Install ClawKit Desktop dependencies
        working-directory: vendor/cc-switch
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: pnpm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: pnpm check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: pnpm vite:build

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Build ClawKit Desktop shell
        working-directory: vendor/cc-switch
        run: pnpm tauri build --no-bundle

      - name: Verify ClawKit Desktop embedded frontend
        run: python scripts/installer/verify-tauri-frontend.py vendor/cc-switch/dist/index.html vendor/cc-switch/src-tauri/target/release/cc-switch.exe

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/windows/app/
          Copy-Item vendor/cc-switch/src-tauri/target/release/cc-switch.exe dist/windows/app/clawkit-desktop.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v", "V")
          $version = $version -replace '[\\/]', '-'
          if (-not $version -or $version -eq "main") {
            $version = "0.0.0-${{ github.run_number }}"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
          Pop-Location

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows/ClawKit-*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "ClawKit installer was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "ClawKit Desktop"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          foreach ($file in @("clawkit-desktop.exe", "codex-plus-plus.exe", "codex-plus-plus-manager.exe")) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($process.ExitCode)" }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ClawKit Desktop shell
        uses: actions/checkout@v4
        with:
          repository: hangvlog/cc-switch
          ref: main
          path: vendor/cc-switch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: pnpm install --frozen-lockfile

      - name: Install ClawKit Desktop dependencies
        working-directory: vendor/cc-switch
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: pnpm vite:build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build ClawKit Desktop shell
        working-directory: vendor/cc-switch
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      - name: Verify ClawKit Desktop embedded frontend
        run: python3 scripts/installer/verify-tauri-frontend.py vendor/cc-switch/dist/index.html vendor/cc-switch/src-tauri/target/${{ matrix.target }}/release/cc-switch

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" \
          CC_SWITCH_BINARY="$PWD/vendor/cc-switch/src-tauri/target/${{ matrix.target }}/release/cc-switch" \
          bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/ClawKit Desktop.app" "dist/macos/stage/ClawKit Codex.app" "dist/macos/stage/ClawKit Settings.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            echo "verified: $app"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: clawkit-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
